# v9.5（dsh，L-08 门禁落地）：PR/push 必过的质量门禁。
#
# 设计取向（便于单独提上游 PR）：
#   1. 不引入任何新依赖，全部用仓库已有的 tsc / eslint / vite；
#   2. 只用通用命令（npm ci / tsc / eslint / build），
#      不引用 fork 专属脚本（quality-gate.ps1 / dsh-smoke.mjs）；
#   3. v9.16（dsh，M4-002）：与 deploy-pages.yml 一样统一到 npm + package-lock.json
#      （仓库此前只有 yarn.lock，两个 lock 并存必然漂移，现以 package-lock.json 为唯一来源）。
#
# 本地等价命令（Windows）：
#   powershell -NoProfile -ExecutionPolicy Bypass -File scripts/quality-gate.ps1
# 本地等价命令（pwsh 7 / Linux / macOS）：
#   npx tsc --noEmit -p tsconfig.json && npx eslint src --ext .ts,.tsx --max-warnings 0 && npm run build
name: Quality Gate
on:
  push:
    branches: [master, dev, dev/e2e]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Lint (eslint --max-warnings 0)
        run: npx eslint src --ext .ts,.tsx --max-warnings 0

      - name: Build (vite)
        run: npm run build
