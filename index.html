<!DOCTYPE html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#818CF8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="Qwerty Learner Plus" />
    <title>Qwerty Learner Plus</title>

    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      // Dark mode init（本地 fork：仅保留应用所需的深色模式初始化，删除营销/统计脚本）
      // v9.15（dsh，M5-004）：原读 localStorage.state 已无写入方（恒不命中），改为读真实键
      //   src/store/index.ts:112 `atomWithStorage('isOpenDarkModeAtom', ...)` 的原始字符串（'true'/'false'），
      //   并包 try/catch；这里只决定首帧是否加 .dark 类，主题切换逻辑（src/index.tsx）不变。
      try {
        var rawDark = localStorage.getItem('isOpenDarkModeAtom')
        var isDark = rawDark == null ? window.matchMedia('(prefers-color-scheme: dark)').matches : rawDark === 'true'
        if (isDark) document.documentElement.classList.add('dark')
      } catch (e) {
        /* 首帧主题仅为防闪，读写失败时保持默认（浅色），交给 React 挂载后应用 */
      }
    </script>
  </head>
  <body>
    <noscript>
      <div>You need to enable JavaScript to run Qwerty Learner.</div>
      <div>你需要启用 JavaScript 来运行 Qwerty Learner。</div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
